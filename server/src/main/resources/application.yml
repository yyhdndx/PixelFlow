server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./runtime-data/pixelflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 8MB
      max-request-size: 9MB
pixelflow:
  jwt-secret: ${PIXELFLOW_JWT_SECRET:}
  seed: ${PIXELFLOW_SEED:false}
  admin-password: ${PIXELFLOW_ADMIN_PASSWORD:}
  public-base-url: ${PIXELFLOW_PUBLIC_BASE_URL:http://127.0.0.1:8080}
  analytics-export-token: ${PIXELFLOW_ANALYTICS_EXPORT_TOKEN:}
  intelligence-base-url: ${PIXELFLOW_INTELLIGENCE_BASE_URL:}
