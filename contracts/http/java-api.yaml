openapi: 3.0.3
info:
  title: PixelFlow Java API
  version: 0.1.0
  description: 业务服务第一版。时间均为 Unix 秒；业务 ID 按字符串传输；Bearer JWT。已提供 Python 事件增量导出，Agent 尚未接入。
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/agent/search/stream:
    post:
      summary: 智能搜索的增量回答
      description: |
        需要登录，保留 /api/agent/search 完整响应接口。question 为1–200个Unicode字符且非空白。
        POST SSE，不自动重连。事件顺序为 meta、phase、sources、delta、done；任意流内故障以error终止。
        每条data为JSON，包含request_id(UUID)及从1递增的seq。meta返回session_id/trace_id，尚不代表会话成功保存。
        phase.phase为retrieving/preparing/generating/validating。sources.sources为已确认公开且作者启用的来源列表。
        delta.text为真实生成增量；done含完整answer/sources/session_id/trace_id/degraded及validated=true，只有done代表成功。
        error含code/message/incomplete=true，已展示内容必须标记未完成；无done断开也视为中断。
        Java在来源及正文输出前校验来源，完成前再次检查来源与引用；失效不得标成功。
        整体预算55秒含完成校验及会话提交，空闲上限15秒，心跳5秒不延长总预算。
        单帧最多16384字节，总流最多262144字节(UTF-8)，answer最多1500字符，sources最多5项。
        主动停止及提交新问题取消旧流；页面返回只重订阅，重试只能由用户触发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 200}
                session_id: {type: string, nullable: true, maxLength: 36, pattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
      responses:
        '200':
          description: SSE事件流；流开始后失败通过error事件表达，不改变HTTP状态
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
            X-Accel-Buffering: {schema: {type: string, enum: ['no']}}
          content:
            text/event-stream:
              schema: {type: string, description: 'event为meta/phase/sources/delta/done/error，data的schema见AgentSearchStreamEvent'}
              example: "event: delta\ndata: {\"request_id\":\"5cc3b214-1a4e-4be9-a127-6b9a392cbfa1\",\"seq\":4,\"text\":\"第一段〔1〕\"}\n\n"
        '400': {description: 流开始前参数无效, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSearchError'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '502': {description: 流开始前上游不可用或协议无效, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSearchError'}}}}
  /api/agent/search:
    post:
      summary: 智能搜索社区作品并返回带出处的综合回答
      description: 仅登录用户。只读转发 Python /agent/search，不缓存回答、不在 Java 记录历史。question 按 Unicode 字符计数为 1–200 且不得全为空白；session_id 可省略、为 null 或空字符串，否则须为 UUID。总上游等待预算 55 秒，含完整响应体。Java 复核所有来源当前为 PUBLISHED 且作者启用，并核对来源文本；任一来源失效或响应无效时整份回答返回 502，不返回部分内容。无来源时统一说明社区内暂未找到相关作品。成功响应不包含内部 user_id/steps。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 200}
                session_id: {type: string, nullable: true, maxLength: 36, pattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
      responses:
        '200':
          description: 综合回答或无结果提示；degraded=1 表示 Python 使用替代回答
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status_code, answer, sources, session_id, trace_id, degraded]
                properties:
                  status_code: {type: integer, enum: [0]}
                  answer: {type: string, minLength: 1, maxLength: 1500}
                  session_id: {type: string, format: uuid}
                  trace_id: {type: string, format: uuid}
                  degraded: {type: integer, enum: [0, 1]}
                  sources:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      additionalProperties: false
                      required: [post_id, title, excerpt, author_name]
                      properties:
                        post_id: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
                        title: {type: string, maxLength: 120}
                        excerpt: {type: string, maxLength: 100}
                        author_name: {type: string, maxLength: 64}
        '400': {description: 请求字段或格式无效, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSearchError'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '502': {description: AGENT_SEARCH_UNAVAILABLE（配置缺失、上游故障或超时）或 INVALID_AGENT_SEARCH_RESPONSE（响应或来源无效）；统一错误结构，不含上游正文或半截回答, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSearchError'}}}}
  /api/agent/copilot:
    post:
      description: 应用内 Copilot。客户端只上报页面与实体 ID，实际上下文由服务端按当前用户权限重新读取；模型只返回提案，写入仍走各自业务接口。仅在登录状态下可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [screen, message]
              properties:
                screen: {type: string, enum: [detail, create, messages]}
                postId: {type: string, pattern: '^[1-9][0-9]{0,18}$', description: screen=detail 时必填}
                draftId: {type: string, pattern: '^[1-9][0-9]{0,18}$', description: screen=create 时必填，必须是自己的草稿}
                conversationIds:
                  type: array
                  maxItems: 10
                  description: screen=messages 时必填，且都必须是当前用户参与的会话
                  items: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
                selection: {type: string, maxLength: 500}
                message: {type: string, minLength: 1, maxLength: 2000}
                history:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [user, assistant]}
                      content: {type: string, maxLength: 500}
      responses:
        '200':
          description: '{status_code, reply, actions, screen, trace_id}；actions 为空表示只回话不动作'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, reply, actions, screen]
                properties:
                  status_code: {type: integer}
                  reply: {type: string, maxLength: 600}
                  screen: {type: string}
                  trace_id: {type: string, nullable: true}
                  actions:
                    type: array
                    description: 按 screen 限定的动作提案；越界、超长或不属于当前用户的动作会被服务端丢弃
                    items:
                      type: object
                      properties:
                        type: {type: string, enum: [POST_COMMENT, UPDATE_DRAFT, SEND_MESSAGES]}
                        rationale: {type: string}
                        text: {type: string, description: POST_COMMENT}
                        title: {type: string, description: UPDATE_DRAFT}
                        content: {type: string, description: UPDATE_DRAFT}
                        items:
                          type: array
                          description: SEND_MESSAGES
                          items:
                            type: object
                            properties:
                              conversation_id: {type: string}
                              text: {type: string}
        '400': {description: 参数缺失（如 detail 无 postId、messages 无会话）}
        '403': {description: 上下文越权（他人草稿、非本人参与的会话）}
        '503': {description: AI 暂不可用，客户端应提示稍后再试}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/create-assist:
    post:
      summary: 为编辑器草稿生成候选及内容风险建议
      description: 需要登录。接收尚未保存的文字快照；不创建或修改作品。服务端调用 DeepSeek（未配置时 provider=rules），校验候选并检查原稿与候选的内容风险。返回的 suggestion_id 绑定当前用户和原稿，有效期 24 小时。Android 确认后填入本地编辑器，再由普通保存/提交接口持久化。模型失败返回 503，不自动覆盖原稿。客户端应允许至少 55 秒并提供取消。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft, goal]
              properties:
                draft:
                  type: object
                  required: [title, content]
                  properties:
                    title: {type: string, maxLength: 120}
                    content: {type: string, maxLength: 5000}
                    tags: {type: array, maxItems: 20, items: {type: string, maxLength: 32}}
                goal: {type: string, enum: [all, improve_title, suggest_tags, polish_content, write_content]}
                prompt: {type: string, maxLength: 200}
                audience: {type: string, maxLength: 64}
      responses:
        '200':
          description: 候选预览；Cache-Control 为 no-store
          content:
            application/json:
              schema:
                type: object
                required: [suggestion_id, provider, title_candidates, content_candidates, tag_suggestions, edit_suggestions, safety]
                properties:
                  suggestion_id: {type: string, format: uuid}
                  trace_id: {type: string}
                  user_id: {type: string}
                  goal: {type: string}
                  provider: {type: string, enum: [deepseek, rules]}
                  policy_version: {type: string}
                  title_candidates: {type: array, items: {type: string, maxLength: 120}}
                  content_candidates: {type: array, items: {type: string, maxLength: 5000}}
                  tag_suggestions: {type: array, items: {type: string}}
                  edit_suggestions: {type: array, items: {type: string}}
                  safety:
                    type: object
                    properties:
                      risk_level: {type: string, enum: [low, medium, high, unknown]}
                      rule_hits: {type: array, items: {type: string}}
                      suggestions: {type: array, items: {type: string}}
                      requires_human_review: {type: boolean}
        '400': {description: 参数无效}
        '401': {description: 登录失效}
        '502': {description: 上游响应不完整}
        '503': {description: 模型超时、不可用、输出无效或服务繁忙；保留原稿，可重试或跳过}
  /api/posts/{id}/assist-application:
    post:
      summary: 将已生成候选直接采纳到已保存草稿
      description: 可选的服务端采纳路径。校验建议归属、有效期、原稿快照、候选成员、作品归属和 expected_version。每个 suggestion_id 只能采纳一次；完全相同的重试返回保存的原始响应，不再次增加版本。相同建议换用其他候选或作品返回 409。话题在 Android 确认时显式加入正文，当前作品没有独立标签字段。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suggestion_id, expected_version, title, content]
              properties:
                suggestion_id: {type: string, format: uuid}
                expected_version: {type: integer, format: int64, minimum: 0}
                title: {type: string, maxLength: 120}
                content: {type: string, maxLength: 5000}
      responses:
        '200': {description: 作品详情，含递增后的 content_version；重复采纳返回原始响应}
        '400': {description: 非候选文本或缺少必填字段}
        '401': {description: 未登录}
        '403': {description: 不是作品作者}
        '404': {description: 建议不存在或不属于当前用户}
        '409': {description: 版本冲突、原稿变化、建议过期、已采纳不同选择或作品状态不允许编辑}
  /api/users/{id}/posts:
    get:
      summary: 分页查询启用用户的公开作品（需登录）
      description: 每页检查目标用户启用状态，不存在或停用返回 404 USER_NOT_FOUND。真实 ID 可查本人，me 按普通 ID 查询。仅 PUBLISHED，含图文和视频；本人及管理员也不能查看其他状态。不应用推荐偏好、屏蔽或不感兴趣过滤。is_liked 来自登录访问者，不接受查询参数改变身份；不返回收藏字段。按数字作品 ID 降序，不按创建时间；无跨页快照，新增、撤回或账号状态变化后应从首页刷新。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}}
        - name: count
          in: query
          description: 省略为 20，仅十进制数字，解析值 1–50；允许前导零。显式空值、裸参数、非整数或溢出为 400 INVALID_ARGUMENT。
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          description: 首页省略；后续传上页 next_cursor，按 p.id 小于游标查询。仅十进制数字字符串，解析值 1–9223372036854775807，允许前导零；显式空值、裸参数、非法值及溢出为 400 INVALID_ARGUMENT。
          schema: {type: string, pattern: '^[0-9]+$', example: '100'}
      responses:
        '200':
          description: 公开作品页；末页或空页 has_more=0 且 next_cursor=null
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/UserPostsPage'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/users/{id}/profile:
    get:
      summary: 查看用户主页公开资料、统计及本人关注状态（需登录）
      description: 仅返回启用账号的公开字段；不存在和停用统一返回 404。支持通过真实 ID 查看本人，me 不作为别名。作品数仅计 PUBLISHED，关系数仅计存在且启用的用户。响应 Cache-Control 为 no-store。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}}
      responses:
        '200': {description: 用户公开资料，不含用户名、角色和账号状态, content: {application/json: {schema: {$ref: '#/components/schemas/PublicUserProfile'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/users/me/followers:
    get:
      summary: 分页查询本人粉丝用户卡片
      description: 仅查询认证本人。只返回存在且启用的用户，按用户 ID 字符串升序，不按关注时间排序；不提供跨页快照，关系变化后请重新刷新。响应 Cache-Control 为 no-store。
      parameters:
        - {$ref: '#/components/parameters/ConnectionsCount'}
        - {$ref: '#/components/parameters/ConnectionsCursor'}
      responses:
        '200': {description: 粉丝卡片，is_following 表示本人是否回关, content: {application/json: {schema: {$ref: '#/components/schemas/UserConnectionsPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/users/me/following:
    get:
      summary: 分页查询本人关注用户卡片
      description: 仅查询认证本人。过滤条件、排序和分页规则与 followers 相同；is_following 为 true。推荐屏蔽偏好不改变关注关系。响应 Cache-Control 为 no-store。
      parameters:
        - {$ref: '#/components/parameters/ConnectionsCount'}
        - {$ref: '#/components/parameters/ConnectionsCursor'}
      responses:
        '200': {description: 关注用户卡片, content: {application/json: {schema: {$ref: '#/components/schemas/UserConnectionsPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /demo-assets/{file}:
    parameters:
      - {name: file, in: path, required: true, schema: {type: string}, description: 随 JAR 打包的文件名，见 catalog.json}
    get:
      security: []
      description: 公共演示照片、头像、MP4、署名和校验清单。不是用户上传内容；支持 Range，素材保留各自许可。
      parameters:
        - {name: Range, in: header, schema: {type: string}, example: 'bytes=0-31'}
      responses:
        '200': {description: 完整资源，Content-Type 按后缀确定}
        '206': {description: 部分字节，包含 Content-Range}
        '416': {description: 请求字节范围不可满足}
        default: {$ref: '#/components/responses/Error'}
    head:
      security: []
      responses:
        '200': {description: 资源元数据，无正文}
        default: {$ref: '#/components/responses/Error'}
  /api/media:
    get:
      summary: 分页查询本人上传的图片及配额
      description: 按 mediaId 字符串升序，不按上传时间排序。只返回元数据，不返回图片字节。列表与配额是查询时快照，删除时再次校验引用。
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: after, in: query, schema: {type: string, default: ''}, description: 上页 nextCursor，小写 UUID；第一页省略}
        - {name: unusedOnly, in: query, schema: {type: boolean, default: false}, description: 仅列出未被任何作品或草稿引用的图片}
      responses:
        '200':
          description: usedCount 是本人全部上传数量，与 unusedOnly 过滤无关
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        mediaId: {type: string, format: uuid}
                        url: {type: string}
                        width: {type: integer}
                        height: {type: integer}
                        size: {type: integer}
                        contentType: {type: string, enum: [image/png]}
                        createdAt: {type: integer, format: int64, description: Unix 秒}
                        referenceCount: {type: integer, description: 包含所有状态作品的引用数量}
                  nextCursor: {type: string, nullable: true, description: 没有下一页时为 null}
                  usedCount: {type: integer}
                  limit: {type: integer, enum: [100]}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: 上传 JPEG/PNG，重新编码为 PNG 后持久化
      description: 需登录。实际输入和输出均最多 8 MiB；最多 400 万像素、单边 8192；每用户最多 100 张。视频、GIF、SVG 不支持。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 请将 mediaId 放入草稿 mediaIds，不要手填上传 URL 到 clips
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaId: {type: string, format: uuid}
                  url: {type: string}
                  type: {type: integer, enum: [0]}
                  width: {type: integer}
                  height: {type: integer}
                  size: {type: integer, description: 重新编码后的字节数}
                  contentType: {type: string, enum: [image/png]}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /api/media/{id}:
    delete:
      summary: 删除本人未被引用的图片并释放配额
      description: 永久删除数据库中的图片与元数据，无回收站。无权访问/已删除返回 404；仍被任意状态作品引用返回 409 MEDIA_IN_USE；管理员不能代删他人的图片。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: 已删除，无响应正文}
        default: {$ref: '#/components/responses/Error'}
  /api/media/{id}/content:
    get:
      security: []
      description: 已关联公开作品且作者启用时游客可读；否则仅上传者或 ADMIN 可读，无权访问返回 404。Cache-Control=no-store。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 经过重新编码的 PNG, content: {image/png: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /health:
    get:
      security: []
      responses:
        '200': {description: 进程可响应，非外部依赖就绪探针, content: {application/json: {example: {status: UP}}}}
  /api/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, nickname]
              properties:
                username: {type: string, pattern: '^[A-Za-z0-9_]{3,32}$'}
                password: {type: string, minLength: 10, maxLength: 72, format: password, description: UTF-8 不超过 72 字节}
                nickname: {type: string, minLength: 1, maxLength: 40}
            example: {username: alice, password: replace-with-your-password, nickname: 小明}
      responses:
        '201': {description: 创建 CREATOR 账号（包含普通用户权限）, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, maxLength: 32}
                password: {type: string, maxLength: 72, format: password}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/logout:
    post:
      responses:
        '200': {description: 注销当前会话，立即撤销对应 JWT 和刷新令牌, content: {application/json: {example: {success: true}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me:
    get:
      summary: 查询本人资料
      responses:
        '200': {$ref: '#/components/responses/CurrentUser'}
        '401': {$ref: '#/components/responses/Error'}
    put:
      summary: 完整替换本人可编辑资料
      description: 仅允许 nickname 和 bio，均必填；昵称先 trim 再按 Java UTF-16 String.length() 校验 1–40，简介原样保存且长度 0–60。最后一次成功写入覆盖之前的值；不修改账号、角色或头像。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserProfileUpdate'}
            example: {nickname: 小明, bio: "摄影与旅行\n记录生活"}
      responses:
        '200': {$ref: '#/components/responses/CurrentUser'}
        '400':
          description: INVALID_ARGUMENT；字段缺失、null、类型或长度错误，以及未知字段均不保存
          content:
            application/json:
              example: {status_code: 400, code: INVALID_ARGUMENT, message: 请求字段或格式不正确, requestId: request-uuid}
        '401': {$ref: '#/components/responses/Error'}
  /api/users/me/avatar:
    put:
      summary: 将本人已上传图片设置为头像
      description: 使用 POST /api/media 返回的 mediaId，仅接受本人媒体。启用用户的头像将可由游客读取；替换不删除旧图。成功响应 Cache-Control 为 no-store。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
      responses:
        '200': {description: 当前头像, content: {application/json: {schema: {$ref: '#/components/schemas/UserAvatar'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: 清除本人头像并恢复默认显示
      description: 幂等，avatar 返回空字符串。只解除头像引用，不删除图片；旧图若无其他公开作品引用则不再允许游客读取。成功响应 Cache-Control 为 no-store。
      responses:
        '200': {description: 已清除头像, content: {application/json: {schema: {$ref: '#/components/schemas/UserAvatar'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/stats:
    get:
      summary: 当前用户统计（作品/粉丝/关注），单次读取，计数不含停用账号
      responses:
        '200':
          description: '响应头含 Cache-Control: no-store'
          content: {application/json: {schema: {$ref: '#/components/schemas/UserStats'}}}
        default: {$ref: '#/components/responses/Error'}
  /feed/:
    get:
      security: []
      parameters:
        - {$ref: '#/components/parameters/Count'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: accept_video_clip, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 仅公开且作者启用的作品；不传 cursor 每次获取第一页
          content:
            application/json:
              schema:
                type: object
                required: [status_code, has_more, post_list, next_cursor]
                properties:
                  status_code: {type: integer, enum: [0]}
                  has_more: {type: integer, enum: [0, 1]}
                  next_cursor: {type: string, nullable: true}
                  post_list: {type: array, items: {$ref: '#/components/schemas/Post'}}
        default: {$ref: '#/components/responses/Error'}
  /api/feed/following:
    get:
      summary: 当前用户关注作者的公开作品流
      description: |
        仅查询认证用户关注的作者，返回 PUBLISHED 且作者存在并启用的作品，图片和视频均返回。
        最新优先（按作品数字 ID 倒序），重新发布不改变排序位置；cursor 为上页 next_cursor，按 id < cursor 续页。
        不应用推荐屏蔽或不感兴趣偏好，不接受客户端指定查询身份。无关注或无公开作品返回空页。
        卡片与 /feed/ 相同，包含 V13 时间字段及当前访问者的点赞、收藏状态。响应 Cache-Control: no-store。
      parameters:
        - name: count
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
          description: 显式空值、非十进制正整数及越界均为 400 INVALID_ARGUMENT
        - name: cursor
          in: query
          schema: {type: string, pattern: '^[0-9]+$'}
          description: 可省略；提供时须为正整数且不超过 9223372036854775807，空值或非法值为 400
      responses:
        '200':
          description: 关注作品分页；末页 next_cursor 为 null
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FollowingFeedPage'}
              examples:
                empty: {value: {status_code: 0, post_list: [], has_more: 0, next_cursor: null}}
                nextPage:
                  value:
                    status_code: 0
                    post_list: [{post_id: '123', title: 示例作品, status: PUBLISHED, is_liked: false, is_favorited: false}]
                    has_more: 1
                    next_cursor: '123'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/search/posts:
    get:
      summary: 按关键词搜索公开作品
      description: |
        仅返回 PUBLISHED 且作者存在并启用的作品；游客可用，无效令牌沿用 401。
        q 去除首尾空白后为 1–60 个 UTF-16 代码单元；可去掉一个开头 #，剩余话题不能为空。
        大小写不敏感，整体短语不拆词：标题前缀或正文中 # 后的前缀命中即可；普通正文不匹配。
        输入中的 %、_ 为字面字符。图片和视频均返回；点赞、收藏状态属于当前访问者，游客均为 false。
        最新优先指作品数字 ID 倒序，cursor 为上页 next_cursor，按 id < cursor 续页；末页为 null。
        title(30) 索引不加速正文话题条件，完整 OR 查询可能扫描；不引入 ES、全文索引或缓存。
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, x-utf16-minLength: 1, x-utf16-maxLength: 60}
          example: 摄影
        - {$ref: '#/components/parameters/Count'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 与 /feed/ 相同的响应结构
          content:
            application/json:
              schema:
                type: object
                required: [status_code, has_more, post_list, next_cursor]
                properties:
                  status_code: {type: integer, enum: [0]}
                  has_more: {type: integer, enum: [0, 1]}
                  next_cursor: {type: string, nullable: true}
                  post_list: {type: array, items: {$ref: '#/components/schemas/Post'}}
              example: {status_code: 0, has_more: 0, next_cursor: null, post_list: []}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts:
    get:
      summary: 分页查询自己的作品，含草稿
      parameters:
        - {$ref: '#/components/parameters/Count'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/Posts'}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: 创建草稿，作者来自 JWT
      description: |
        无键沿用每次创建并返回201。有效键按认证用户隔离，首次201，同键同规范Draft重放200并返回作品当前内容和状态，不重新校验媒体、不重置状态。
        title/content保留空白；clips/mediaIds省略、null、空数组等价；媒体及clip顺序有意义，JSON属性顺序无关。
        键不自动过期；作品不存在返回404 POST_NOT_FOUND，绝不补建。同键不同请求返回409 IDEMPOTENCY_CONFLICT。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 单个严格8-4-4-4-12十六进制UUID，允许大写并规范为小写；空、空白、重复头及逗号合并多值均返回400 INVALID_ARGUMENT。
          schema: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
          example: 123e4567-e89b-12d3-a456-426614174000
      requestBody: {$ref: '#/components/requestBodies/Draft'}
      responses:
        '201': {$ref: '#/components/responses/Post'}
        '200': {$ref: '#/components/responses/Post'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: 同用户同键不同规范请求，IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema:
                type: object
                required: [status_code, code, message, requestId]
                properties:
                  status_code: {type: integer}
                  code: {type: string, enum: [IDEMPOTENCY_CONFLICT]}
                  message: {type: string}
                  requestId: {type: string}
              example: {status_code: 409, code: IDEMPOTENCY_CONFLICT, message: 同一键不能用于不同的创建请求, requestId: example-request}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: []
      description: 公开作品游客可读；非公开作品仅作者或管理员可读，否则 404。
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
    put:
      description: 仅作者可编辑 DRAFT、REJECTED、WITHDRAWN，编辑后为 DRAFT。整份替换，遗漏 clips/mediaIds 表示清空媒体，不是局部更新。
      requestBody: {$ref: '#/components/requestBodies/Draft'}
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/publish:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 作者提交审核，需非空白标题和至少一个媒体，否则 409 INCOMPLETE_DRAFT。返回 PENDING，不直接公开，PENDING 重试不变。
      responses:
        '200': {$ref: '#/components/responses/PostStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/withdraw:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 作者撤回自己的作品（含待审核和草稿），设为 WITHDRAWN。
      responses:
        '200': {$ref: '#/components/responses/PostStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/comments:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 登录用户对已公开作品发表评论；content 1–500 字非空白；成功返回完整评论对象（回复时含 parent_comment_id/root_comment_id/parent_nickname），posts.comment_count +1。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 500}
                parentCommentId: {type: string, pattern: '^[1-9][0-9]{0,18}$', description: 可选；回复某条评论时携带，须属于同一作品；回复“回复”会被收拢到同一一级评论下}
      responses:
        '200': {$ref: '#/components/responses/Comment'}
        default: {$ref: '#/components/responses/Error'}
    get:
      description: 登录可见；一级评论按 comment_id 倒序游标分页，只返回 VISIBLE，每条带 replies（该一级评论下的可见回复，时间正序，数量不限）与 reply_count；默认每页 20，count 1–50。
      parameters:
        - {name: cursor, in: query, schema: {type: integer, format: int64, minimum: 1}, description: 上一页末条一级评论 comment_id}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: '{status_code, comment_list, has_more, next_cursor}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, comment_list, has_more, next_cursor]
                properties:
                  status_code: {type: integer}
                  has_more: {type: integer, enum: [0, 1]}
                  next_cursor: {type: [string, 'null']}
                  comment_list: {type: array, items: {$ref: '#/components/schemas/Comment'}}
        default: {$ref: '#/components/responses/Error'}
  /api/comments/{commentId}:
    parameters:
      - {name: commentId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    delete:
      description: 作者本人或 ADMIN 软删（status=DELETED）；删一级评论会级联删除它下面的全部回复，按实际删除条数扣减可见计数；重复删除幂等返回成功。
      responses:
        '200': {description: '{commentId, status: DELETED, removed}'}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/comments/{commentId}/status:
    parameters:
      - {name: commentId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      description: 仅 ADMIN 隐藏/恢复评论（HIDDEN/VISIBLE）；操作一级评论会连同其回复一起变更并按实际条数调整可见计数；DELETED 不可变更。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [VISIBLE, HIDDEN]}
      responses:
        '200': {description: '{commentId, status}'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/summary:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: 登录用户对已公开作品做长文提炼；只读正文（不读评论、不跨作品），正文不足 200 字返回 400。模型不可用返回 503，界面应提示“先读原文”。
      responses:
        '200':
          description: '{status_code, summary, points, content_length, trace_id}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, summary, points]
                properties:
                  status_code: {type: integer}
                  summary: {type: string, maxLength: 200, description: 一句话概括}
                  points: {type: array, maxItems: 5, items: {type: string, maxLength: 200}}
                  content_length: {type: integer, minimum: 0}
                  trace_id: {type: string, nullable: true}
        '400': {description: 正文过短（SHORT_TEXT），客户端应隐藏入口}
        '503': {description: AI 不可用，客户端提示先读原文}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/summary/stream:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: 登录用户提炼已公开长文。SSE 先发 summary（完整概括），再发 point（完整要点），最终 done 再确认作品版本与输出完整性；断开或 error 时保留内容并标为未完成。55秒整体预算、15秒空闲、5秒心跳、16KiB单帧、256KiB总量。取消关闭连接，不自动重试。原完整接口保留。
      responses:
        '200':
          description: '每个 data JSON 遵循 components.schemas.PostSummaryStreamEvent。事件 payload 均有 seq；summary 含 summary，point 含 point，done 含 summary/points/content_length/trace_id/validated=true；error 含 code/message/incomplete=true。完成前的内容不可标为成功。'
          content:
            text/event-stream:
              schema: {type: string}
        '400': {description: 正文不足200字}
        '401': {description: 未登录}
        '404': {description: 作品不可见}
        '503': {description: AI服务不可用}
  /api/posts/{id}/auto-replies:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: 仅作品作者（或 ADMIN）可读；返回该作品的「场景 → 答案」规则，按创建顺序。
      responses:
        '200':
          description: '{status_code, rules}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, rules]
                properties:
                  status_code: {type: integer}
                  rules: {type: array, items: {$ref: '#/components/schemas/AutoReplyRule'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: 新增一条自动回复规则；每篇作品最多 10 条。是否命中场景由 Agent 判定，不做关键词匹配。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, answer]
              properties:
                question: {type: string, minLength: 1, maxLength: 200, description: 场景描述，例如“有人问价格”}
                answer: {type: string, minLength: 1, maxLength: 300, description: 命中后逐字发送的答案}
      responses:
        '200': {$ref: '#/components/responses/AutoReplyRule'}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/auto-replies/batch:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 仅作品作者（或 ADMIN）。批量创建规则（AI 候选多选后「应用」用），一次 1–10 条；与每篇 10 条上限一起校验，超限整体 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rules]
              properties:
                rules:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [question, answer]
                    properties:
                      question: {type: string, minLength: 1, maxLength: 200}
                      answer: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: '{status_code, created: [AutoReplyRule]}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, created]
                properties:
                  status_code: {type: integer}
                  created: {type: array, items: {$ref: '#/components/schemas/AutoReplyRule'}}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/auto-replies/suggest:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 仅作品作者（或 ADMIN）。Agent 依据作品标题/正文，把作者的一句话描述拆成 1–5 条「场景 → 答案」候选；不落库，由作者挑选后再 POST 规则。事实只能来自作者描述与作品正文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: '{status_code, suggestions: [{question, answer}], degraded, reason}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, suggestions, degraded]
                properties:
                  status_code: {type: integer}
                  degraded: {type: boolean}
                  reason: {type: string}
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      additionalProperties: false
                      required: [question, answer]
                      properties:
                        question: {type: string, minLength: 1, maxLength: 200}
                        answer: {type: string, minLength: 1, maxLength: 300}
        '503': {description: Agent 不可用，界面应提示手动填写}
        default: {$ref: '#/components/responses/Error'}
  /api/posts/{id}/auto-replies/{ruleId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: ruleId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      description: 修改场景、答案或启停；禁用后该规则不再参与 Agent 判定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, answer, enabled]
              properties:
                question: {type: string, minLength: 1, maxLength: 200}
                answer: {type: string, minLength: 1, maxLength: 300}
                enabled: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/AutoReplyRule'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      description: 删除一条规则；重复删除返回 404。
      responses:
        '200': {description: '{ruleId, deleted: true}'}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/notifications:
    get:
      description: 登录用户按类型查看通知（@我/回复/赞），notification_id 倒序游标分页；被屏蔽类型返回空列表。
      parameters:
        - {name: type, in: query, required: true, schema: {type: string, enum: [MENTION, REPLY, LIKE]}}
        - {name: cursor, in: query, schema: {type: integer, format: int64, minimum: 1}, description: 上一页末项 notification_id}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: '{status_code, notification_list, has_more, next_cursor}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, notification_list, has_more, next_cursor]
                properties:
                  status_code: {type: integer}
                  has_more: {type: integer, enum: [0, 1]}
                  next_cursor: {type: [string, 'null']}
                  notification_list: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/notifications/unread-count:
    get:
      description: 未读通知总数（不含已屏蔽类型），用于导航角标。
      responses:
        '200': {description: '{count}', content: {application/json: {schema: {type: object, required: [count], properties: {count: {type: integer, format: int64}}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/notifications/read:
    post:
      description: 标记已读；body 为空或 ids 缺省时全部已读，否则仅标记指定 id。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: {type: array, items: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: '{updated: true}'}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/notification-preferences:
    get:
      description: 已屏蔽的通知类型列表。
      responses:
        '200': {description: '{muted_types: [...]}', content: {application/json: {schema: {type: object, required: [muted_types], properties: {muted_types: {type: array, items: {type: string, enum: [MENTION, REPLY, LIKE]}}}}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      description: 设置屏蔽类型（整单覆盖）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mutedTypes]
              properties:
                mutedTypes: {type: array, items: {type: string, enum: [MENTION, REPLY, LIKE]}}
      responses:
        '200': {description: '{muted_types: [...]}'}
        default: {$ref: '#/components/responses/Error'}
  /api/interactions/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [likes, favorites, follows, not-interested]}}
    get:
      parameters:
        - {name: after, in: query, schema: {type: string, maxLength: 36, default: ''}, description: 上一页末项 target_id，按字符串排序}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: 当前用户的有效互动
          content:
            application/json:
              schema: {type: array, items: {type: object, properties: {target_id: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      description: 幂等设置状态；follows 的 targetId 是用户 ID，其余是作品 ID；允许取消已下架作品的互动。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId, active]
              properties:
                targetId: {type: string, minLength: 1, maxLength: 36}
                active: {type: boolean}
                recommendationId: {type: string, maxLength: 36, description: 可选推荐批次归因}
                eventId: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: 可选客户端反馈幂等键}
            example: {targetId: '1', active: true}
      responses:
        '200': {description: 已持久化目标状态, content: {application/json: {example: {targetId: '1', active: true}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/events:
    post:
      description: 仅接收已公开作品事件，userId 取自 JWT；source 固定 CLIENT。DWELL 必须带 durationMs，其他事件不得带。同一用户同一 eventId 同载荷去重，不同载荷 409；LIKE/UNLIKE 的可靠业务事件由互动接口另行记录。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
            example: {eventId: unique-client-event-id, postId: '1', type: CLICK, occurredAt: 1790697600}
      responses:
        '200': {description: 事件已落库或已处理, content: {application/json: {example: {eventId: unique-client-event-id, duplicate: false}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/favorites:
    get:
      description: 本人收藏的完整作品卡片，仅返回启用作者的 PUBLISHED 图文及视频。按作品数字 ID 降序，不是收藏时间；可见性在分页前过滤。身份来自 Bearer 会话，忽略 userId/user_id；不受推荐偏好影响。不提供跨请求快照，变更后可刷新第一页。原互动收藏读写接口保持不变。
      parameters:
        - {$ref: '#/components/parameters/NumericPageCount'}
        - name: cursor
          in: query
          description: 首次省略；后续传上页 next_cursor。仅接受十进制正整数，显式空值、重复参数或超过 long 上限返回 400。
          schema: {type: string, pattern: '^[0-9]+$', example: '123'}
      responses:
        '200':
          description: 本人收藏作品分页；has_more 为数字 0/1，末页游标为 null。
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoritesPage'}
              example: {status_code: 0, post_list: [], has_more: 0, next_cursor: null}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/profile/history:
    get:
      description: 本人历史画像只读代理，转发当前用户 JWT 到 Python /profiles/me/history。忽略 userId/user_id，不触发同步或重算，不按当前主题抑制改写历史。验证上游身份、摘要字段、降序版本及游标，只返回白名单摘要字段；所有响应禁止缓存。Python 端口仍保持内部访问。
      parameters:
        - {$ref: '#/components/parameters/NumericPageCount'}
        - name: before_version
          in: query
          description: 首次省略；后续传 next_cursor。十进制正整数，最大 9223372036854775807；显式空值、重复参数、非数字或越界返回 Java 400 INVALID_ARGUMENT（Python 原生端点为 422）。
          schema: {type: string, pattern: '^[0-9]+$', example: '8'}
      responses:
        '200':
          description: 实际持久化的历史摘要；has_more 为布尔值，无历史返回空 items，末页 next_cursor 为 null。
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileHistoryPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '502': {description: INVALID_ANALYTICS_RESPONSE，上游身份不符、JSON/摘要无效或分页矛盾；不回显上游正文}
        '503': {description: ANALYTICS_UNAVAILABLE，分析服务未配置、连接失败、三秒请求超时或上游非成功状态；不跟随重定向}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/profile:
    get:
      description: 登录用户本人画像代理。Java 转发当前用户 JWT 到 Python /profiles/me，并校验响应 user_id；不可指定别人的 userId，不触发同步。字段详见 python-analytics.md。
      responses:
        '200':
          description: 最近一次同步产生的画像快照；Cache-Control 为 no-store。
          content:
            application/json:
              schema:
                type: object
                required: [user_id, version, topics]
                properties:
                  user_id: {type: string}
                  version: {type: integer}
                  generated_at: {type: integer, format: int64}
                  rule_version: {type: string}
                  cold_start: {type: boolean}
                  topics:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        score: {type: number}
                        share: {type: number}
                  suppressed_topics: {type: array, items: {type: string}, description: 已抑制主题；topics 已剔除这些主题}
        '502': {description: 上游画像身份不符或响应结构无效}
        '503': {description: 分析服务未配置、超时或不可用；普通社区业务不受影响}
        default: {$ref: '#/components/responses/Error'}
  /api/recommendations/me/feed:
    get:
      description: 本人个性化推荐交付。Java 代理 Python 预览流水线，把推荐作品补全为公开卡片；单页最多 10 条，不分页。Cache-Control no-store。
      responses:
        '200':
          description: 推荐卡片列表；无候选或偏好版本变化时 post_list 为空
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationFeed'}
        '401': {description: 未登录或令牌失效}
        '503': {description: 分析服务未配置、超时或不可用；普通社区业务不受影响}
        default: {$ref: '#/components/responses/Error'}
  /api/recommendations/me/preferences:
    get:
      description: 登录用户本人推荐偏好快照；Cache-Control no-store。
      responses:
        '200':
          description: 本人偏好
          content:
            application/json:
              schema:
                type: object
                required: [user_id, personalized, version, excluded_post_ids, blocked_author_ids, suppressed_topics]
                properties:
                  user_id: {type: string}
                  personalized: {type: boolean}
                  version: {type: integer}
                  excluded_post_ids: {type: array, items: {type: string}}
                  blocked_author_ids: {type: array, items: {type: string}}
                  suppressed_topics: {type: array, items: {type: string}}
        default: {$ref: '#/components/responses/Error'}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [personalized]
              properties:
                personalized: {type: boolean}
      responses:
        '200': {description: 更新后的本人偏好，同 GET 形状}
        default: {$ref: '#/components/responses/Error'}
  /api/recommendations/me/preferences/import:
    post:
      description: 显式导入当前账号的旧 Python 偏好。仅允许 Java 完全默认且 version=0，或内容完全相同的幂等重试；不覆盖、不自动合并已有偏好。同一用户锁内事务提交，不生成虚假的新行为事件；历史作品可已不存在。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_user_id, personalized, excluded_post_ids, blocked_author_ids]
              properties:
                source_user_id: {type: string, minLength: 1, maxLength: 36, description: 必须与认证用户 ID 一致，否则403}
                personalized: {type: boolean}
                excluded_post_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, pattern: '^[1-9][0-9]{0,17}$'}}
                blocked_author_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}}
      responses:
        '200':
          description: 本人偏好快照；首次实际导入版本加1，相同内容不重复递增；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreferenceSnapshot'}
        '409': {description: PREFERENCE_MIGRATION_CONFLICT，保持原有数据不变}
        default: {$ref: '#/components/responses/Error'}
  /api/recommendations/me/blocked-authors/{author_id}:
    parameters:
      - {name: author_id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}}
    put:
      description: 推荐专用作者屏蔽，不是封禁或社交访问控制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blocked]
              properties:
                blocked: {type: boolean}
      responses:
        '200': {description: 更新后的本人偏好，同 GET 形状；超 500 个返回 409 BLOCK_LIMIT}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/profile/topics/{topic}:
    parameters:
      - {name: topic, in: path, required: true, schema: {type: string}}
    put:
      description: 记录兴趣标签抑制；topic 必须在支持集合内，否则 400 UNSUPPORTED_TOPIC。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [suppressed]
              properties:
                suppressed: {type: boolean}
      responses:
        '200': {description: 更新后的本人偏好，同推荐偏好形状}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/agent/traces:
    get:
      summary: 管理员分页查看 Agent 执行轨迹
      description: 仅 ADMIN，可跨用户查询审计轨迹。转发 Python GET /internal/traces，内部使用 PIXELFLOW_INTELLIGENCE_TOKEN，不转发用户令牌。按自增 id 倒序，下一页 id 小于 cursor；省略 count 默认 20。显式空值、重复参数或非法值返回 400，允许十进制前导零。Java 不读取 analytics 库。上游完整响应等待最多 10 秒；成功响应 no-store。
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: cursor, in: query, schema: {type: string, pattern: '^[0-9]+$'}, description: 正整数 long 范围的自增 id，第一页省略}
      responses:
        '200':
          description: 轨迹摘要；空列表或末页 next_cursor 为 null
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentTracePage'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/AgentTraceFailure'}
  /api/admin/agent/traces/{trace_id}:
    get:
      summary: 管理员查看单次 Agent 执行详情
      description: 仅 ADMIN。转发 Python GET /internal/traces/{trace_id}。仅输出约定字段，不透传密钥、原始系统提示或未知扩展字段；上游 404 映射 TRACE_NOT_FOUND，其余上游故障或无效响应为 502。普通用户不能读取任何人的轨迹，管理员可查看跨用户审计信息。历史 sources 作为执行记录展示，不授予公开读取作品的权限。
      parameters:
        - {name: trace_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 轨迹详情
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status_code, trace]
                properties:
                  status_code: {type: integer, enum: [0]}
                  trace: {$ref: '#/components/schemas/AgentTraceDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/AgentTraceFailure'}
  /api/admin/agent/moderation-suggestion:
    post:
      summary: 管理员请求作品 AI 审核建议
      description: 仅 ADMIN。按 post_id 读取作品快照（标题/正文）转发 Python POST /internal/moderation-suggestion，内部使用 PIXELFLOW_INTELLIGENCE_TOKEN，不接收浏览器直连。Python 侧先执行 content-safety 规则（安全下限），再可选经 DeepSeek 汇总建议；规则 high 时最终结果不低于 reject。只建议、不自动审核，通过/驳回仍由管理员人工决定。每次调用产生 trace_id，可经轨迹查询接口核查。上游等待最多 15 秒；成功响应 no-store。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [post_id]
              properties:
                post_id: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
      responses:
        '200':
          description: 审核建议（风险等级 + 建议处置 + 理由 + 规则命中）
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status_code, suggestion]
                properties:
                  status_code: {type: integer, enum: [0]}
                  suggestion: {$ref: '#/components/schemas/ModerationSuggestion'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/admin/posts:
    get:
      description: 仅 ADMIN；返回 Post 数组，包含可空的 submit_time、review_time、publish_time（Unix 秒）。提交时间未知时展示为“—”，不使用 create_time 冒充；保持 ID 倒序游标分页。
      parameters:
        - {$ref: '#/components/parameters/Count'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, PENDING, PUBLISHED, REJECTED, WITHDRAWN], default: PENDING}}
      responses:
        '200': {$ref: '#/components/responses/Posts'}
        default: {$ref: '#/components/responses/Error'}
  /api/internal/analytics/events:
    get:
      security: [{analyticsRead: []}]
      description: 独立只读服务身份 events:read；用户/管理员 JWT 不可使用。按提交顺序导出，一页最多50项；数据库 source_id 变化时不得复用分析库游标。导出记录审计，不包含密码或会话。
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: items 按 seq 递增；空页 next_cursor 等于 after；未公开作品 title 为空且 eligible=false。
          content:
            application/json:
              schema:
                type: object
                required: [source_id, items, next_cursor, has_more]
                properties:
                  source_id: {type: string}
                  next_cursor: {type: integer, format: int64}
                  has_more: {type: boolean}
                  items:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/StoredEvent'}
                        - type: object
                          properties:
                            author_id: {type: string}
                            has_video: {type: boolean}
                            title: {type: string}
                            eligible: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/posts/{id}/moderation:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      description: 仅 ADMIN；PENDING 可通过/驳回，PUBLISHED 可下架；原子保存状态和审核记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: {type: string, enum: [PUBLISHED, REJECTED, WITHDRAWN]}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/PostStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/users:
    get:
      description: 仅 ADMIN，不返回密码或令牌字段
      parameters:
        - {name: after, in: query, schema: {type: string, maxLength: 36, default: ''}}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200': {description: 用户列表, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/users/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      description: 仅 ADMIN，不允许操作自己；停用撤销全部会话，启用不恢复旧令牌；保存状态审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, reason]
              properties:
                enabled: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {description: 账号状态, content: {application/json: {example: {id: user-id, enabled: false}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/events:
    get:
      description: 仅 ADMIN，用于人工导出；Python 服务身份尚未开放。
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200': {description: 按 seq 递增的数据，续页使用末项 seq, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/StoredEvent'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/moderation:
    get:
      description: 仅 ADMIN
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200': {description: 按 id 递增的审核审计，续页使用末项 id, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModerationRecord'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /demo-media/{id}.png:
    get:
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 24}}
      responses:
        '200': {description: 本地生成演示封面, content: {image/png: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations:
    post:
      description: 与目标用户创建一对一会话；已存在时返回既有会话（去重）。不能和自己建会话（400）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetUserId]
              properties:
                targetUserId: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}
      responses:
        '200': {description: 会话（新建或既有）, content: {application/json: {schema: {$ref: '#/components/schemas/Conversation'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      description: 会话列表，按 last_message_time 倒序游标分页；每条带对方资料、最后消息摘要与未读数。
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: 上一页末项游标（last_message_time:conversation_id）}
      responses:
        '200':
          description: '{status_code, conversation_list, has_more, next_cursor}'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      description: 历史消息，id 倒序游标分页；带 after 参数时只取增量（id > after，正序）。
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 30}}
        - {name: cursor, in: query, schema: {type: integer, format: int64, minimum: 1}, description: 上一页末项 message id}
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 1}, description: 轮询增量：返回 id 大于该值的消息}
      responses:
        '200':
          description: '{status_code, message_list, has_more, next_cursor}'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivateMessagePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: 发送纯文本消息（1–1000 字，空白拒绝）；成功后更新会话最后消息。同用户 20 条/分钟限流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: 新消息, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMessage'}}}}
        '429': {description: 频率超限，返回 Retry-After 头}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/messages/batch:
    post:
      description: 批量发送私信（Copilot 一次回复多人）。单事务，全部成功或全部失败；同一会话在一次请求里只能出现一次；每次最多 10 条。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [conversation_id, content]
                    properties:
                      conversation_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
                      content: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: '{status_code, sent: [{conversation_id, message_id, content, create_time}]}'
          content:
            application/json:
              schema:
                type: object
                required: [status_code, sent]
                properties:
                  status_code: {type: integer}
                  sent:
                    type: array
                    items:
                      type: object
                      properties:
                        conversation_id: {type: string}
                        message_id: {type: string}
                        content: {type: string}
                        create_time: {type: integer}
        '400': {description: 条数超限、重复会话或内容为空/超长}
        '403': {description: 非会话参与者}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/{id}/read:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      description: 标记已读；body 为空读到最新，否则读到指定消息 id；幂等。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lastReadMessageId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
      responses:
        '200': {description: '{updated: true}'}
        default: {$ref: '#/components/responses/Error'}
  /api/users/me/messages/unread-count:
    get:
      description: 私聊未读消息总数，用于消息 Tab 角标。
      responses:
        '200': {description: '{count}', content: {application/json: {schema: {type: object, required: [count], properties: {count: {type: integer, format: int64}}}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    analyticsRead: {type: http, scheme: bearer, bearerFormat: opaque, description: PIXELFLOW_ANALYTICS_EXPORT_TOKEN，至少32字符；仅允许读取内部事件接口，禁止放入客户端。}
  parameters:
    NumericPageCount:
      name: count
      in: query
      description: 省略为 20；十进制正整数，值为 1–50；允许前导零，空值、非数字、越界和重复参数返回 400 INVALID_ARGUMENT。
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    ConnectionsCount:
      name: count
      in: query
      description: 省略时为 20；显式空值、非十进制正整数或越界返回 INVALID_ARGUMENT。
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    ConnectionsCursor:
      name: cursor
      in: query
      description: 上页 next_cursor；第一页省略，不能传空字符串。不要求游标对应用户仍存在。
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,36}$'}
    Id: {name: id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    Count: {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    Cursor: {name: cursor, in: query, schema: {type: integer, format: int64, minimum: 1}, description: 上页 next_cursor 或末项作品 ID，仅向更小 ID 翻页}
    After: {name: after, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
  requestBodies:
    Draft:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Draft'}
          example: {title: 我的作品, content: 正文, clips: [{type: 0, width: 600, height: 800, url: 'https://example.com/image.png'}]}
  responses:
    AgentTraceFailure:
      description: 502 AGENT_TRACE_UNAVAILABLE（未配置、网络、超时、上游鉴权/服务失败）或 INVALID_AGENT_TRACE_RESPONSE（结构/字段无效）；不透传上游错误正文。
      content: {application/json: {schema: {$ref: '#/components/schemas/AgentSearchError'}}}
    RateLimited:
      description: 启用 Redis 限流后超出固定窗口额度；所有到达的尝试计数，成功不重置，超限不续期。Redis 故障时 fail-open。登录按 IP 总量及 IP/小写账号分别计数；注册按 IP；上传按认证用户。
      headers:
        Retry-After:
          description: 所有超额维度剩余窗口秒数最大值，向上取整且至少 1。
          schema: {type: integer, minimum: 1}
          example: 12
        Cache-Control:
          schema: {type: string, enum: [no-store]}
        X-Request-Id:
          schema: {type: string}
      content:
        application/json:
          schema:
            type: object
            required: [status_code, code, message, requestId]
            properties:
              status_code: {type: integer, enum: [429]}
              code: {type: string, enum: [RATE_LIMITED]}
              message: {type: string}
              requestId: {type: string}
          example: {status_code: 429, code: RATE_LIMITED, message: 请求过于频繁，请稍后重试, requestId: 'c4f36eb0-a783-43ac-8d70-c359b45292b4'}
    Error:
      description: 400 参数无效；401 未认证；403 无权限；404 不存在/不可见；409 冲突/草稿不完整/媒体配额；413 超出上传大小；500 内部异常。所有响应含 X-Request-Id。
      content:
        application/json:
          schema:
            type: object
            required: [status_code, code, message, requestId]
            properties:
              status_code: {type: integer}
              code: {type: string}
              message: {type: string}
              requestId: {type: string}
          example: {status_code: 401, code: UNAUTHORIZED, message: 请先登录, requestId: request-uuid}
    Tokens:
      description: 访问令牌 900 秒；刷新令牌 7 天，一次性轮换；刷新时旧访问令牌也失效。
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: {type: string}
              refreshToken: {type: string}
              tokenType: {type: string, enum: [Bearer]}
              expiresIn: {type: integer, example: 900}
    CurrentUser:
      description: '本人资料；响应头 Cache-Control: no-store'
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
          example: {id: user-id, username: alice, nickname: 小明, role: CREATOR, enabled: true, bio: '', avatar: ''}
    Post: {description: 作品详情, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
    Posts: {description: 作品列表，续页取末项 post_id；空数组表示结束, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Post'}}}}}
    PostStatus: {description: 作品状态, content: {application/json: {schema: {type: object, properties: {postId: {type: string}, status: {type: string}}}}}}
    Comment: {description: 评论对象, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
    AutoReplyRule: {description: 评论自动回复规则, content: {application/json: {schema: {$ref: '#/components/schemas/AutoReplyRule'}}}}
  schemas:
    FollowingFeedPage:
      type: object
      required: [status_code, post_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        post_list: {type: array, items: {$ref: '#/components/schemas/Post'}}
        has_more: {type: integer, enum: [0, 1]}
        next_cursor: {type: string, nullable: true, description: 存在下一页时为本页末条作品数字 ID，否则为 null}
    Comment:
      type: object
      additionalProperties: false
      required: [comment_id, post_id, content, status, create_time, author]
      description: 两级评论结构。parent_comment_id 只在回复时存在，且恒为所属一级评论 id；回复的回复不会更深一层。
      properties:
        comment_id: {type: string, pattern: '^[1-9][0-9]*$'}
        post_id: {type: string, pattern: '^[1-9][0-9]*$'}
        parent_comment_id: {type: string, nullable: true, pattern: '^[1-9][0-9]*$', description: 仅回复评论时存在，值是所属一级评论 id}
        root_comment_id: {type: string, nullable: true, pattern: '^[1-9][0-9]*$', description: 仅回复评论时存在，等于所属一级评论 id；创建回复的响应也会带}
        parent_nickname: {type: string, nullable: true, description: 回复时被回复者昵称，用于渲染“回复 @某人”}
        auto: {type: boolean, description: 为 true 表示这条回复是 Agent 按作者规则自动发出的，客户端需标注“自动回复”}
        reply_count: {type: integer, minimum: 0, description: 仅列表接口的一级评论返回，该评论下的可见回复数}
        replies:
          type: array
          description: 仅列表接口的一级评论返回，按时间正序。
          items: {$ref: '#/components/schemas/Comment'}
        content: {type: string, minLength: 1, maxLength: 500}
        status: {type: string, enum: [VISIBLE, HIDDEN, DELETED]}
        create_time: {type: integer, format: int64, minimum: 0}
        author:
          type: object
          additionalProperties: false
          required: [user_id, nickname, avatar]
          properties:
            user_id: {type: string, maxLength: 36}
            nickname: {type: string, maxLength: 40}
            avatar: {type: string}
    AutoReplyRule:
      type: object
      additionalProperties: false
      required: [id, question, answer, enabled, create_time, update_time]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        question: {type: string, minLength: 1, maxLength: 200, description: 场景描述}
        answer: {type: string, minLength: 1, maxLength: 300, description: 命中后逐字发送的答案}
        enabled: {type: boolean}
        create_time: {type: integer, format: int64, minimum: 0}
        update_time: {type: integer, format: int64, minimum: 0}
    Notification:
      type: object
      additionalProperties: false
      required: [notification_id, type, actor, post_id, post_title, read, create_time]
      properties:
        notification_id: {type: string, pattern: '^[1-9][0-9]*$'}
        type: {type: string, enum: [MENTION, REPLY, LIKE]}
        actor:
          type: object
          additionalProperties: false
          required: [user_id, nickname, avatar]
          properties:
            user_id: {type: string, maxLength: 36}
            nickname: {type: string, maxLength: 40}
            avatar: {type: string}
        post_id: {type: string, pattern: '^[1-9][0-9]*$'}
        post_title: {type: string, maxLength: 120}
        comment_id: {type: string, nullable: true, pattern: '^[1-9][0-9]*$'}
        read: {type: boolean}
        create_time: {type: integer, format: int64, minimum: 0}
    AgentTracePage:
      type: object
      additionalProperties: false
      required: [status_code, traces, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        traces: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/AgentTraceSummary'}}
        next_cursor: {type: string, nullable: true, pattern: '^[1-9][0-9]*$'}
    AgentTraceSummary:
      type: object
      additionalProperties: false
      required: [trace_id, user_id, question, created_at, latency_ms, degraded, source_count, provider]
      properties:
        trace_id: {type: string, format: uuid}
        user_id: {type: string, minLength: 1, maxLength: 36}
        question: {type: string, maxLength: 80, description: 按 Unicode 字符截断，不追加省略号}
        created_at: {type: integer, format: int64, minimum: 0, description: Unix 秒}
        latency_ms: {type: integer, format: int64, minimum: 0}
        degraded: {type: integer, enum: [0, 1]}
        source_count: {type: integer, minimum: 0, maximum: 5}
        provider: {type: string, maxLength: 64}
    AgentTraceDetail:
      type: object
      additionalProperties: false
      required: [trace_id, user_id, session_id, question, created_at, latency_ms, degraded, degraded_reason, provider, retrieval, llm, answer, sources]
      properties:
        trace_id: {type: string, format: uuid}
        user_id: {type: string, minLength: 1, maxLength: 36}
        session_id: {type: string, maxLength: 36, description: UUID 或空字符串}
        question: {type: string, maxLength: 200}
        created_at: {type: integer, format: int64, minimum: 0}
        latency_ms: {type: integer, format: int64, minimum: 0}
        degraded: {type: integer, enum: [0, 1]}
        degraded_reason: {type: string, maxLength: 500}
        provider: {type: string, maxLength: 64}
        retrieval:
          type: object
          additionalProperties: false
          required: [query, candidate_count, selected_ids]
          properties:
            query: {type: string, maxLength: 200}
            candidate_count: {type: integer, minimum: 0}
            selected_ids: {type: array, maxItems: 5, items: {type: string, pattern: '^[1-9][0-9]{0,17}$'}}
        llm:
          type: object
          additionalProperties: false
          required: [model, latency_ms]
          properties:
            model: {type: string, maxLength: 64}
            latency_ms: {type: integer, format: int64, minimum: 0}
        answer: {type: string, maxLength: 1500}
        sources:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [post_id, title]
            properties:
              post_id: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
              title: {type: string, maxLength: 120}
    ModerationSuggestion:
      type: object
      additionalProperties: false
      required: [suggestion_id, post_id, risk_level, recommended_action, reason, rule_hits, suggestions, policy_version, provider, latency_ms, trace_id, degraded]
      properties:
        suggestion_id: {type: string, format: uuid}
        post_id: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
        risk_level: {type: string, enum: [low, medium, high]}
        recommended_action: {type: string, enum: [approve, review, reject]}
        reason: {type: string, minLength: 1, maxLength: 500}
        rule_hits: {type: array, maxItems: 10, items: {type: string, pattern: '^[a-z_]{1,32}$'}}
        suggestions: {type: array, maxItems: 10, items: {type: string, maxLength: 200}}
        policy_version: {type: string, maxLength: 64}
        provider: {type: string, maxLength: 64, description: deepseek 或 rules（降级）}
        latency_ms: {type: integer, format: int64, minimum: 0}
        trace_id: {type: string, format: uuid}
        degraded: {type: integer, enum: [0, 1]}
    AgentSearchStreamEvent:
      type: object
      additionalProperties: false
      required: [request_id, seq]
      oneOf:
        - {required: [session_id, trace_id], maxProperties: 4, description: meta}
        - {required: [phase], maxProperties: 3, description: phase}
        - {required: [sources], maxProperties: 3, description: sources}
        - {required: [text], maxProperties: 3, description: delta}
        - {required: [answer, sources, session_id, trace_id, degraded, validated], maxProperties: 8, description: done}
        - {required: [code, message, incomplete], maxProperties: 5, description: error}
      properties:
        request_id: {type: string, format: uuid}
        seq: {type: integer, minimum: 1}
        session_id: {type: string, format: uuid, description: meta及done必需}
        trace_id: {type: string, format: uuid, description: meta及done必需}
        phase: {type: string, enum: [retrieving, preparing, generating, validating], description: phase事件必需}
        text: {type: string, description: delta事件必需}
        answer: {type: string, maxLength: 1500, description: done事件必需}
        degraded: {type: integer, enum: [0, 1], description: done事件必需}
        validated: {type: boolean, enum: [true], description: done事件必需}
        incomplete: {type: boolean, enum: [true], description: error事件必需}
        code: {type: string, description: error事件必需}
        message: {type: string, maxLength: 200, description: error事件安全文案}
        sources:
          type: array
          maxItems: 5
          description: sources及done事件必需
          items:
            type: object
            additionalProperties: false
            required: [post_id, title, excerpt, author_name]
            properties:
              post_id: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
              title: {type: string, maxLength: 120}
              excerpt: {type: string, maxLength: 100}
              author_name: {type: string, maxLength: 64}
    PostSummaryStreamEvent:
      type: object
      additionalProperties: false
      required: [seq]
      oneOf:
        - {required: [summary], maxProperties: 2, description: summary}
        - {required: [point], maxProperties: 2, description: point}
        - {required: [summary, points, content_length, trace_id, validated], maxProperties: 6, description: done}
        - {required: [code, message, incomplete], maxProperties: 4, description: error}
      properties:
        seq: {type: integer, minimum: 1}
        summary: {type: string, minLength: 1, maxLength: 60}
        point: {type: string, minLength: 1, maxLength: 80}
        points: {type: array, minItems: 3, maxItems: 5, items: {type: string, minLength: 1, maxLength: 80}}
        content_length: {type: integer, minimum: 200}
        trace_id: {type: string, format: uuid}
        validated: {type: boolean, enum: [true]}
        code: {type: string}
        message: {type: string, maxLength: 200}
        incomplete: {type: boolean, enum: [true]}
    AgentSearchError:
      type: object
      required: [status_code, code, message, requestId]
      properties:
        status_code: {type: integer}
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    UserPostsPage:
      type: object
      additionalProperties: false
      required: [status_code, post_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        post_list: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Post'}}
        has_more: {type: integer, enum: [0, 1], description: SQL 查询 count+1 条，仅存在额外记录时为 1}
        next_cursor: {type: string, nullable: true, description: 有下一页时为本页最后一个数字作品 ID，否则为 null}
    FavoritePost:
      allOf:
        - {$ref: '#/components/schemas/Post'}
        - type: object
          required: [post_id, title, content, create_time, status, author, clips, media_ids, hashtag, music, like_count, is_liked, is_favorited]
          properties:
            is_liked: {type: boolean, description: 当前请求用户的点赞状态}
            is_favorited: {type: boolean, enum: [true]}
    FavoritesPage:
      type: object
      additionalProperties: false
      required: [status_code, post_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        post_list: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/FavoritePost'}}
        has_more: {type: integer, enum: [0, 1]}
        next_cursor: {type: string, nullable: true, description: 有下一页时为本页最后一个作品 ID，否则为 null}
    RecommendationFeed:
      type: object
      additionalProperties: false
      required: [post_list, strategy, reason, profile_version, preferences_changed]
      properties:
        post_list: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/RecommendationPost'}}
        strategy: {type: string, enum: [personalized, popular]}
        reason: {type: string, description: 画像可用或降级原因；关闭个性化时 personalization_disabled}
        profile_version: {type: integer, format: int64, description: 本次使用的画像版本；未使用画像时为 0}
        preferences_changed: {type: boolean, description: 返回前偏好版本变化；为 true 时 post_list 为空，客户端可重新请求}
    RecommendationPost:
      allOf:
        - {$ref: '#/components/schemas/Post'}
        - type: object
          properties:
            rec_reason: {type: string, nullable: true, description: 该作品的推荐理由}
            rec_score: {type: number, format: double, nullable: true, description: 排序分数，保留 6 位小数}
    ProfileHistoryWeight:
      type: object
      additionalProperties: false
      required: [name, score, share]
      properties:
        name: {type: string}
        score: {type: number, format: double, description: 有限数值}
        share: {type: number, format: double, description: 有限数值}
    ProfileHistoryItem:
      type: object
      additionalProperties: false
      required: [version, rule_version, generated_at, window_days, timezone, cold_start, topics, media, event_counts, explanation]
      properties:
        version: {type: integer, format: int64, minimum: 1}
        rule_version: {type: string}
        generated_at: {type: integer, format: int64}
        window_days: {type: integer, format: int64}
        timezone: {type: string}
        cold_start: {type: boolean}
        topics: {type: array, items: {$ref: '#/components/schemas/ProfileHistoryWeight'}}
        media: {type: array, items: {$ref: '#/components/schemas/ProfileHistoryWeight'}}
        event_counts: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        explanation: {type: string}
    ProfileHistoryPage:
      type: object
      additionalProperties: false
      required: [user_id, items, has_more, next_cursor]
      properties:
        user_id: {type: string}
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ProfileHistoryItem'}}
        has_more: {type: boolean}
        next_cursor: {type: string, nullable: true, description: 有下一页时为本页最后一个 version 的十进制字符串，否则为 null}
    PreferenceSnapshot:
      type: object
      required: [user_id, personalized, version, excluded_post_ids, blocked_author_ids, suppressed_topics]
      properties:
        user_id: {type: string}
        personalized: {type: boolean}
        version: {type: integer, minimum: 0}
        excluded_post_ids: {type: array, maxItems: 1000, items: {type: string}}
        blocked_author_ids: {type: array, maxItems: 500, items: {type: string}}
        suppressed_topics: {type: array, maxItems: 7, items: {type: string}}
    User:
      type: object
      required: [id, username, nickname, role, enabled, bio, avatar]
      properties:
        id: {type: string}
        username: {type: string}
        nickname: {type: string}
        role: {type: string, enum: [CREATOR, ADMIN]}
        enabled: {type: boolean}
        bio: {type: string, x-utf16-maxLength: 60, description: 默认空字符串，不为 null；最多 60 个 Java UTF-16 单元}
        avatar: {type: string, description: 现有头像 URL，普通新账号为空字符串，不为 null}
    UserProfileUpdate:
      type: object
      additionalProperties: false
      required: [nickname, bio]
      properties:
        nickname: {type: string, x-utf16-minLength: 1, x-utf16-maxLength: 40, description: trim 后按 Java UTF-16 String.length() 校验 1–40 个单元}
        bio: {type: string, x-utf16-maxLength: 60, description: 原样保存，按 Java UTF-16 String.length() 校验最多 60 个单元}
    UserAvatar:
      type: object
      additionalProperties: false
      required: [user_id, avatar]
      properties:
        user_id: {type: string}
        avatar: {type: string, description: 头像 URL；清除后为空字符串，由客户端展示默认头像}
    UserStats:
      type: object
      required: [user_id, post_count, follower_count, following_count]
      properties:
        user_id: {type: string, description: 当前用户 UUID}
        post_count: {type: integer, format: int64, minimum: 0, description: 状态为 PUBLISHED 的作品数}
        follower_count: {type: integer, format: int64, minimum: 0, description: 关注当前用户的启用账号数}
        following_count: {type: integer, format: int64, minimum: 0, description: 当前用户关注的启用账号数}
    UserConnectionCard:
      description: 用户卡片不包含私有账号字段。
      type: object
      additionalProperties: false
      required: [user_id, nickname, bio, avatar, is_following]
      properties:
        user_id: {type: string}
        nickname: {type: string}
        bio: {type: string}
        avatar: {type: string, description: 无头像时为空字符串}
        is_following: {type: boolean, description: 当前登录用户是否关注此卡片用户}
    UserConnectionsPage:
      type: object
      additionalProperties: false
      required: [status_code, user_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        user_list: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/UserConnectionCard'}}
        has_more: {type: integer, enum: [0, 1]}
        next_cursor: {type: string, nullable: true, description: 有下一页时为本页最后一个 user_id，否则为 null}
    PublicUserProfile:
      type: object
      additionalProperties: false
      required: [user_id, nickname, bio, avatar, post_count, follower_count, following_count, is_following]
      properties:
        user_id: {type: string}
        nickname: {type: string}
        bio: {type: string, description: 可以为空字符串，不为 null}
        avatar: {type: string, description: 可以为空字符串，不为 null}
        post_count: {type: integer, format: int64, minimum: 0}
        follower_count: {type: integer, format: int64, minimum: 0}
        following_count: {type: integer, format: int64, minimum: 0}
        is_following: {type: boolean, description: 当前认证用户是否关注目标账号}
    Clip:
      type: object
      additionalProperties: false
      required: [width, height, url]
      properties:
        type: {type: integer, enum: [0, 1], default: 0, description: 0 图片，1 视频}
        width: {type: integer, minimum: 1, maximum: 16384}
        height: {type: integer, minimum: 1, maximum: 16384}
        url: {type: string, maxLength: 2048, pattern: '^https?://[^\s]+$'}
    Draft:
      type: object
      additionalProperties: false
      description: 允许空标题和无媒体保存草稿；clips 与 mediaIds 非空时互斥，mediaIds 仅允许本人上传，顺序即展示顺序。
      required: [title, content]
      properties:
        title: {type: string, maxLength: 120}
        content: {type: string, maxLength: 5000}
        clips: {type: array, maxItems: 9, items: {$ref: '#/components/schemas/Clip'}, description: 兼容外部媒体 URL，不允许本站 api/media 内容路径}
        mediaIds: {type: array, maxItems: 9, uniqueItems: true, items: {type: string, maxLength: 36}, description: 本人上传的 mediaId，可省略}
    Post:
      type: object
      properties:
        post_id: {type: string}
        title: {type: string}
        content: {type: string}
        create_time: {type: integer, format: int64, description: 草稿创建时间（Unix 秒），创建后不变；公开时间展示使用 publish_time，null 时回退到 create_time}
        submit_time: {type: integer, format: int64, nullable: true, description: 最近一次实际进入 PENDING 的时间（Unix 秒）；历史未知为 null，重复提交不刷新}
        review_time: {type: integer, format: int64, nullable: true, description: 最近一次 PENDING 审核通过或驳回的时间（Unix 秒）；历史未知为 null}
        publish_time: {type: integer, format: int64, nullable: true, description: 最近一次审核通过的发布时间（Unix 秒）；尚未发布为 null，撤回保留原值}
        status: {type: string, enum: [DRAFT, PENDING, PUBLISHED, REJECTED, WITHDRAWN]}
        content_version: {type: integer, description: 草稿内容版本，建议采纳的乐观并发控制用；默认 0，每次编辑或采纳递增}
        author:
          type: object
          properties:
            user_id: {type: string}
            nickname: {type: string}
            avatar: {type: string, description: 演示账号提供本地头像 URL，普通新账号默认为空}
        clips: {type: array, items: {$ref: '#/components/schemas/Clip'}}
        media_ids: {type: array, items: {type: string}, description: 本站附件 ID，顺序固定；编辑回传时使用 mediaIds，不要直接回传含本站 URL 的 clips}
        hashtag: {type: array, items: {type: object}, description: 当前为空数组，标签提取待实现}
        music: {type: object, nullable: true, description: 当前为 null，音乐元数据待实现}
        like_count: {type: integer, format: int64}
        comment_count: {type: integer, description: 当前可见评论数，发评/删评/隐藏/恢复时事务内维护}
        is_liked: {type: boolean, description: 当前认证用户是否点赞；游客为 false。Feed 和详情提供此字段。}
        is_favorited: {type: boolean, description: 当前认证用户是否收藏；游客为 false。}
    Event:
      type: object
      additionalProperties: false
      required: [eventId, postId, type, occurredAt]
      properties:
        eventId: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        postId: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
        type: {type: string, enum: [EXPOSURE, CLICK, DWELL, LIKE, FAVORITE, FOLLOW, SHARE, NOT_INTERESTED, PUBLISH]}
        occurredAt: {type: integer, format: int64, description: 最近 30 天到未来 5 分钟内；示例时间须替换为当前时间}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 1800000, description: 仅 DWELL 必填}
        scene: {type: string, enum: [HOME, DETAIL]}
    StoredEvent:
      type: object
      properties:
        seq: {type: integer, format: int64}
        event_id: {type: string}
        user_id: {type: string}
        post_id: {type: integer, format: int64}
        event_type: {type: string}
        occurred_at: {type: integer, format: int64}
        received_at: {type: integer, format: int64}
        duration_ms: {type: integer, format: int64, nullable: true}
        scene: {type: string, nullable: true}
        source: {type: string, enum: [CLIENT, SERVER]}
        recommendation_id: {type: string, nullable: true, maxLength: 36, description: V6 新增的可空归因字段；当前仅保存来源提供的标识，不代表已验证推荐交付归属}
    ModerationRecord:
      type: object
      properties:
        id: {type: integer, format: int64}
        actor_id: {type: string}
        post_id: {type: integer, format: int64}
        before_status: {type: string}
        after_status: {type: string}
        reason: {type: string}
        created_at: {type: integer, format: int64}
    Conversation:
      type: object
      additionalProperties: false
      required: [conversation_id, create_time, last_message_time, partner, last_message, unread_count]
      description: 一对一会话。last_message 在无消息时为 null。
      properties:
        conversation_id: {type: string, pattern: '^[1-9][0-9]*$'}
        create_time: {type: integer, format: int64, minimum: 0}
        last_message_time: {type: integer, format: int64, nullable: true}
        partner:
          type: object
          additionalProperties: false
          required: [user_id, nickname, avatar]
          properties:
            user_id: {type: string, maxLength: 36}
            nickname: {type: string, maxLength: 40}
            avatar: {type: string}
        last_message:
          type: object
          nullable: true
          properties:
            message_id: {type: string, pattern: '^[1-9][0-9]*$'}
            content: {type: string, maxLength: 1000}
            create_time: {type: integer, format: int64}
        unread_count: {type: integer, minimum: 0}
    PrivateMessage:
      type: object
      additionalProperties: false
      required: [message_id, conversation_id, sender_id, content, create_time]
      properties:
        message_id: {type: string, pattern: '^[1-9][0-9]*$'}
        conversation_id: {type: string, pattern: '^[1-9][0-9]*$'}
        sender_id: {type: string, maxLength: 36}
        content: {type: string, minLength: 1, maxLength: 1000}
        create_time: {type: integer, format: int64, minimum: 0}
    ConversationPage:
      type: object
      required: [status_code, conversation_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        conversation_list: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        has_more: {type: integer, enum: [0, 1]}
        next_cursor: {type: string, nullable: true, description: 存在下一页时为本页末条会话的 last_message_time 与 id 组合串，否则为 null}
    PrivateMessagePage:
      type: object
      required: [status_code, message_list, has_more, next_cursor]
      properties:
        status_code: {type: integer, enum: [0]}
        message_list: {type: array, items: {$ref: '#/components/schemas/PrivateMessage'}}
        has_more: {type: integer, enum: [0, 1]}
        next_cursor: {type: string, nullable: true, description: 存在下一页时为本页末条消息 id，否则为 null}
